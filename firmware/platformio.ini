; ESP32-S3-WROOM-1 N16R8 WiFi CSI sensor node.
;
; Board note: the N16R8 module pairs 16 MB of *quad* SPI flash with 8 MB of
; *octal* SPI PSRAM, which is the `qio_opi` memory type.  Setting this wrong is
; the classic way to get a board that boots to a reset loop -- the bootloader
; probes PSRAM on pins the module does not wire that way.  It is also why
; GPIO26-37 are unavailable for peripherals on this variant.
;
; Serial note: this board carries a CP2102 USB-UART bridge, so the console is
; hardware UART0 (GPIO43/44), not the ESP32-S3's native USB.  ARDUINO_USB_CDC_ON_BOOT
; must therefore stay 0, or Serial writes vanish into a USB peripheral that
; nothing is connected to.

[env:esp32s3_csi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 921600 is the highest rate a CP2102 sustains reliably.  The CSI stream needs
; only ~119 kbit/s at 100 Hz, so this leaves ~85% headroom -- deliberately, so
; that a burst never backs up into the WiFi driver's callback.
monitor_speed = 921600
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ESP32_WIFI_CSI_ENABLED=1

lib_deps =
    nrf24/RF24@^1.4.11
; The CC1101 is driven by src/cc1101_driver.{h,cpp} rather than a library.
; SmartRC/ELECHOUSE assumes it owns the global SPI object and latches an
; "initialised" flag, which makes it impossible to share SPI2 with the nRF24.

monitor_filters = esp32_exception_decoder
