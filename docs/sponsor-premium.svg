<svg xmlns="http://www.w3.org/2000/svg" width="300" height="90" viewBox="0 0 300 90">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .btn-glow {
        fill: url(#bg);
        rx: 30px;
        filter: url(#glow);
        animation: pulse 2.5s ease-in-out infinite alternate;
        transform-origin: 135px 30px;
      }
      .btn-core {
        fill: url(#bg);
        rx: 30px;
      }
      .text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 0.5px;
      }
      .icon {
        font-size: 26px;
        animation: float 3s ease-in-out infinite;
        transform-origin: 25px 25px;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.1); }
      }
      @keyframes pulse {
        0% { opacity: 0.5; transform: scale(0.96); }
        100% { opacity: 1; transform: scale(1.04); }
      }
    </style>
  </defs>
  <g transform="translate(15, 15)">
    <rect class="btn-glow" x="0" y="0" width="270" height="60" />
    <rect class="btn-core" x="0" y="0" width="270" height="60" />
    <text class="icon" x="20" y="42">☕</text>
    <text class="text" x="60" y="38">Support the Creator</text>
  </g>
</svg>
