<svg xmlns="http://www.w3.org/2000/svg" width="320" height="90" viewBox="0 0 320 90">
  <style>
    .box { fill: #FF90E8; stroke: #111; stroke-width: 4px; }
    .shadow { fill: #111; }
    .text { font-family: 'Arial Black', Impact, sans-serif; font-size: 22px; fill: #111; text-transform: uppercase; font-weight: 900; }
    .wrapper { transform-origin: 0 0; animation: bounce 1.5s infinite alternate steps(2); }
    @keyframes bounce {
      0% { transform: translate(0px, 0px); }
      100% { transform: translate(4px, 4px); }
    }
  </style>
  <g transform="translate(10, 10)">
    <rect class="shadow" x="8" y="8" width="290" height="60" />
    <g class="wrapper">
        <rect class="box" x="0" y="0" width="290" height="60" />
        <text class="text" x="35" y="38">☕ SUPPORT CREATOR</text>
    </g>
  </g>
</svg>
