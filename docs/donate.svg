<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="33%" stop-color="#60EFFF" />
      <stop offset="66%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
      <animate attributeName="x1" values="0%;-200%" dur="3s" repeatCount="indefinite" linear="linear"/>
      <animate attributeName="x2" values="200%;0%" dur="3s" repeatCount="indefinite" linear="linear"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .btn-glow { 
        fill: none;
        stroke: url(#border-glow);
        stroke-width: 4px;
        rx: 10px; 
        filter: url(#glow); 
        animation: pulse 2s ease-in-out infinite alternate; 
        transform-origin: 150px 45px; 
      }
      .btn-core { 
        fill: url(#bg); 
        rx: 10px; 
        stroke: rgba(255,255,255,0.1);
        stroke-width: 1px;
      }
      .text { 
        font-family: 'Courier New', Courier, monospace; 
        font-size: 18px; 
        font-weight: bold; 
        fill: #60EFFF; 
        letter-spacing: 2px; 
      }
      .icon {
        font-family: 'Courier New', Courier, monospace;
        font-size: 22px;
        fill: #00FF87;
        animation: glitch 3s infinite;
      }
      @keyframes glitch {
        0%, 90% { transform: translate(0); opacity: 1; }
        92% { transform: translate(-2px, 2px); opacity: 0.8; }
        94% { transform: translate(2px, -2px); opacity: 0.9; }
        96% { transform: translate(0); opacity: 1; }
      }
      @keyframes pulse {
        0% { opacity: 0.6; transform: scale(0.98); }
        100% { opacity: 1; transform: scale(1.02); }
      }
    </style>
  </defs>
  
  <g transform="translate(15, 20)">
    <rect class="btn-glow" x="0" y="0" width="290" height="60" />
    <rect class="btn-core" x="0" y="0" width="290" height="60" />
    <text class="icon" x="25" y="38">_FUND</text>
    <text class="text" x="95" y="36">EXECUTE()</text>
  </g>
</svg>
