<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .btn-glow { 
        fill: url(#bg); 
        rx: 30px; 
        filter: url(#glow); 
        animation: pulse 3s ease-in-out infinite alternate; 
        transform-origin: 150px 45px; 
      }
      .btn-core { 
        fill: url(#bg); 
        rx: 30px; 
      }
      .text { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        font-size: 21px; 
        font-weight: 800; 
        fill: #ffffff; 
        letter-spacing: 0.5px; 
      }
      .heart { 
        animation: beat 1.2s infinite; 
        transform-origin: 50px 45px; 
      }
      @keyframes beat {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.3); }
        30% { transform: scale(1); }
        45% { transform: scale(1.15); }
      }
      @keyframes pulse {
        0% { opacity: 0.4; transform: scale(0.96); }
        100% { opacity: 1; transform: scale(1.04); }
      }
    </style>
  </defs>
  
  <g transform="translate(15, 20)">
    <!-- Glowing background that breathes -->
    <rect class="btn-glow" x="0" y="0" width="290" height="60" />
    <!-- Solid core button -->
    <rect class="btn-core" x="0" y="0" width="290" height="60" />
    
    <!-- Beating Heart Vector -->
    <g class="heart">
      <path fill="#ffffff" transform="translate(25, 14) scale(1.5)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </g>
    
    <!-- Text -->
    <text class="text" x="75" y="38">Support this project</text>
  </g>
</svg>